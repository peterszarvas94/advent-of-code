<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSPM TinyMCE Demo</title>

  <!-- Import Map (normally generated by jspm) -->
  <script type="importmap">
  {
    "imports": {
      "tinymce": "https://cdn.jsdelivr.net/npm/tinymce@7/+esm",
      "tinymce/": "https://cdn.jsdelivr.net/npm/tinymce@7/"
    }
  }
  </script>
</head>
<body>
  <h1>JSPM + TinyMCE Demo</h1>
  <textarea id="editor"></textarea>

  <!-- Using ESM imports with the import map -->
  <script type="module">
    import tinymce from 'tinymce';

    tinymce.init({
      selector: '#editor',
      height: 500,
      menubar: false,
      plugins: 'lists link',
      toolbar: 'undo redo | bold italic | bullist numlist'
    });
  </script>
</body>
</html>
