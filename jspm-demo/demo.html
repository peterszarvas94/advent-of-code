<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSPM TinyMCE Working Demo</title>

  <!-- This import map would be generated by: npx jspm link tinymce -->
  <script type="importmap">
  {
    "imports": {
      "tinymce": "https://cdn.jsdelivr.net/npm/tinymce@7/+esm",
      "tinymce/icons/default": "https://cdn.jsdelivr.net/npm/tinymce@7/icons/default/+esm",
      "tinymce/themes/silver": "https://cdn.jsdelivr.net/npm/tinymce@7/themes/silver/+esm",
      "tinymce/models/dom": "https://cdn.jsdelivr.net/npm/tinymce@7/models/dom/+esm"
    }
  }
  </script>
</head>
<body>
  <h1>TinyMCE with Import Maps</h1>
  <textarea id="editor">Hello JSPM World!</textarea>

  <script type="module">
    // Import using the bare specifier from import map
    import tinymce from 'tinymce';

    // Import icons and theme
    import 'tinymce/icons/default';
    import 'tinymce/themes/silver';
    import 'tinymce/models/dom';

    // Initialize TinyMCE
    tinymce.init({
      selector: '#editor',
      height: 400,
      menubar: false,
      plugins: 'lists link',
      toolbar: 'undo redo | bold italic | bullist numlist | link'
    });

    console.log('TinyMCE loaded via ES modules!');
  </script>
</body>
</html>
